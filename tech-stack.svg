<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <!-- Неоновое свечение и мягкая тень -->
    <filter id="hex-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hex-poly {
      stroke-width: 2.5;
    }
    .hex-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- ==================== РЯД 0 (4 соты) ==================== -->

  <!-- 1. JAVASCRIPT -->
  <g transform="translate(70, 15)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#F7DF1E" stroke="#E5C50B" class="hex-poly"/>
    <text x="42" y="50" fill="#000000" font-size="28" class="hex-text">JS</text>
  </g>

  <!-- 2. REACT -->
  <g transform="translate(160, 15)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#00D8FF" stroke="#00B2D6" class="hex-poly"/>
    <!-- React Atom Icon -->
    <g transform="translate(42, 48) scale(0.75)">
      <ellipse rx="22" ry="8" fill="none" stroke="#FFFFFF" stroke-width="2.8"/>
      <ellipse rx="22" ry="8" transform="rotate(60)" fill="none" stroke="#FFFFFF" stroke-width="2.8"/>
      <ellipse rx="22" ry="8" transform="rotate(120)" fill="none" stroke="#FFFFFF" stroke-width="2.8"/>
      <circle r="4" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 3. PHP -->
  <g transform="translate(250, 15)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#777BB4" stroke="#5A5F96" class="hex-poly"/>
    <text x="42" y="50" fill="#FFFFFF" font-size="24" class="hex-text">PHP</text>
  </g>

  <!-- 4. GIT -->
  <g transform="translate(340, 15)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#F05032" stroke="#CC3C22" class="hex-poly"/>
    <!-- Git Branch Icon -->
    <g transform="translate(26, 28) scale(1.35)" fill="#FFFFFF">
      <path d="M19.4 12.3c-.6-.6-1.5-.7-2.2-.2l-2.6-2.6v-2c.6-.3 1.1-.9 1.1-1.7 0-1.1-.9-2-2-2s-2 .9-2 2c0 .8.5 1.4 1.1 1.7v5.5c-.6.3-1.1.9-1.1 1.7 0 .8.5 1.4 1.1 1.7v2c-.6.3-1.1.9-1.1 1.7 0 1.1.9 2 2 2s2-.9 2-2c0-.8-.5-1.4-1.1-1.7v-1.8l2.5 2.5c.7.5 1.6.4 2.2-.2.8-.8.8-2.1 0-2.9zM13.7 5.8c0-.4.3-.8.8-.8s.8.3.8.8-.3.8-.8.8-.8-.4-.8-.8zm.8 14.4c-.4 0-.8-.3-.8-.8s.3-.8.8-.8.8.3.8.8-.4.8-.8.8zm3.9-3.9c-.3.3-.8.3-1.1 0-.3-.3-.3-.8 0-1.1.3-.3.8-.3 1.1 0 .3.3.3.8 0 1.1z"/>
    </g>
  </g>

  <!-- ==================== РЯД 1 (3 соты) ==================== -->

  <!-- 5. TYPESCRIPT -->
  <g transform="translate(115, 92)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#3178C6" stroke="#235A96" class="hex-poly"/>
    <text x="42" y="50" fill="#FFFFFF" font-size="28" class="hex-text">TS</text>
  </g>

  <!-- 6. NODE.JS -->
  <g transform="translate(205, 92)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#339933" stroke="#267326" class="hex-poly"/>
    <!-- Node Icon -->
    <g transform="translate(42, 48) scale(0.95)">
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>
      <text x="0" y="2" fill="#FFFFFF" font-size="14" class="hex-text" font-weight="900">NODE</text>
    </g>
  </g>

  <!-- 7. POWERSHELL -->
  <g transform="translate(295, 92)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#012456" stroke="#5391FE" stroke-width="3" class="hex-poly"/>
    <text x="42" y="49" fill="#5391FE" font-size="27" class="hex-text">&gt;_</text>
  </g>

  <!-- ==================== РЯД 2 (2 соты) ==================== -->

  <!-- 8. TAILWIND (Исправлен и идеально отцентрован) -->
  <g transform="translate(160, 169)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#06B6D4" stroke="#0891B2" class="hex-poly"/>
    <!-- Official Tailwind Vector Wave -->
    <g transform="translate(19, 32) scale(1.9)" fill="#FFFFFF">
      <path d="M12.001 4.8c-3.2 0-5.2 1.6-6 4.8 1.2-1.6 2.6-2.2 4.2-1.8.913.228 1.565.89 2.288 1.624C13.666 10.618 15.027 12 18.001 12c3.2 0 5.2-1.6 6-4.8-1.2 1.6-2.6 2.2-4.2 1.8-.913-.228-1.565-.89-2.288-1.624C16.337 6.182 14.976 4.8 12.001 4.8zm-6 7.2c-3.2 0-5.2 1.6-6 4.8 1.2-1.6 2.6-2.2 4.2-1.8.913.228 1.565.89 2.288 1.624 1.177 1.194 2.538 2.576 5.512 2.576 3.2 0 5.2-1.6 6-4.8-1.2 1.6-2.6 2.2-4.2 1.8-.913-.228-1.565-.89-2.288-1.624C10.337 13.382 8.976 12 6.001 12z"/>
    </g>
  </g>

  <!-- 9. LINUX -->
  <g transform="translate(250, 169)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#18181B" stroke="#FACC15" stroke-width="2.5" class="hex-poly"/>
    <!-- Terminal Prompt -->
    <text x="42" y="42" fill="#FACC15" font-size="20" class="hex-text" font-weight="900">#_</text>
    <text x="42" y="65" fill="#E4E4E7" font-size="12" class="hex-text" font-weight="700" letter-spacing="1">LINUX</text>
  </g>

  <!-- ==================== РЯД 3 (1 сота по центру) ==================== -->

  <!-- 10. MORVIN / CYBER VIBE -->
  <g transform="translate(205, 246)" filter="url(#hex-shadow)">
    <polygon points="42,0 84,24 84,72 42,96 0,72 0,24" fill="#7C3AED" stroke="#C084FC" stroke-width="3" class="hex-poly"/>
    <!-- Glowing Golden Lightning Bolt -->
    <path d="M43 25 L32 45 L41 45 L38 65 L52 42 L43 42 Z" fill="#FACC15" stroke="#FFF7ED" stroke-width="1.2" filter="url(#gold-glow)"/>
    <text x="42" y="74" fill="#FFFFFF" font-size="11" class="hex-text" font-weight="800" letter-spacing="1.5">MORVIN</text>
  </g>

</svg>
